services:
  postgres:
    image: postgres:16-alpine
    container_name: jira-form-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: jira-form-backend
    ports:
      - "8000:8000"
    volumes:
      - portal_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      CONTRACTS_DATABASE_URL: ${CONTRACTS_DATABASE_URL:?Set CONTRACTS_DATABASE_URL in .env}
      SQLITE_MIGRATION_ENABLED: ${SQLITE_MIGRATION_ENABLED:-true}
      SQLITE_SOURCE_DATABASE_URL: ${SQLITE_SOURCE_DATABASE_URL:-sqlite:////app/data/portal.db}
      SQLITE_CONTRACTS_SOURCE_DATABASE_URL: ${SQLITE_CONTRACTS_SOURCE_DATABASE_URL:-sqlite:////app/data/contracts.db}
      UPLOAD_DIR: ./data/uploads
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      USERS_SEED_ENABLED: ${USERS_SEED_ENABLED:-true}
      USERS_SEED_FILE: ${USERS_SEED_FILE:-/users.xlsx}
      DEFAULT_USER_PASSWORD: ${DEFAULT_USER_PASSWORD:-change-me-before-production}
      TIMESHEET_DEMO_USERNAME: ${TIMESHEET_DEMO_USERNAME:-ma.shoeib}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-portal.admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-before-production}
      ADMIN_MAX_DEVICES: ${ADMIN_MAX_DEVICES:-4}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-https://jira.vosouq.me}
      JIRA_ENABLED: ${JIRA_ENABLED:-true}
      JIRA_USERNAME: ${JIRA_USERNAME:-}
      JIRA_PASSWORD: ${JIRA_PASSWORD:-}
      REPORTS_API_KEY: ${REPORTS_API_KEY:-change-me-before-production}
      BACKEND_CORS_ORIGINS: http://localhost:3000,http://localhost:8080
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        BACKEND_URL: http://backend:8000
    container_name: jira-form-web
    depends_on:
      - backend
    ports:
      - "8080:3000"
    environment:
      BACKEND_URL: http://backend:8000
    restart: unless-stopped

volumes:
  portal_data:
  postgres_data:
